{% for marca in marcas %}
<tr>
    <td class="py-3 px-4 fw-bold text-accent">{{ marca.nombre }}</td>
    <td class="py-3 px-4 text-center">{{ marca.num_materiales }}</td>
    <td class="py-3 px-4 text-center">
        <div class="d-flex justify-content-center gap-2">
            <a href="{% url 'catalogo:editar_marca' marca.pk %}"
               class="btn-action btn-action--edit btn-table-action rounded-circle"
               title="Editar">
                <i class="bi bi-pencil"></i>
            </a>
            <form method="post" action="{% url 'catalogo:cambiar_estado_marca' marca.pk %}"
                  class="d-inline">
                {% csrf_token %}
                <button type="submit"
                        class="btn-action {{ marca.boton_estado }} btn-action--rounded"
                        title="{% if marca.activo %}Inhabilitar marca{% else %}Habilitar marca{% endif %}"
                        aria-label="{% if marca.activo %}Inhabilitar marca{% else %}Habilitar marca{% endif %}">
                    {% if marca.activo %}
                        <i class="bi bi-check-circle-fill"></i>
                    {% else %}
                        <i class="bi bi-x-circle-fill"></i>
                    {% endif %}
                </button>
            </form>
        </div>
    </td>
</tr>
{% empty %}
<tr>
    <td colspan="3" class="text-center py-5">
        <div class="py-5">
            <i class="bi bi-tag text-muted mb-3 d-block" style="font-size: 3rem;"></i>
            <p class="text-muted fw-medium mb-0">No se encontraron marcas.</p>
            <small class="text-muted">Crea una nueva marca usando el botón superior.</small>
        </div>
    </td>
</tr>
{% endfor %}
