{% for t in tipos %}
<tr class="u-inline-e91738c112">
    <td class="py-3 px-4 text-center fw-bold text-accent">{{ t.codigo_catalogo }}</td>
    <td class="py-3 px-4">
        <div class="d-flex align-items-center gap-3">
            <div
                class="rounded-circle d-flex align-items-center justify-content-center fw-bold flex-shrink-0 u-inline-ddca8f0ddd">
                {{ t.nombre_empresa|first|upper }}
            </div>
            <span class="fw-medium u-inline-6e24079678">{{ t.nombre_empresa }}</span>
        </div>
    </td>
    <td class="py-3 px-4 text-center">
        <span class="badge rounded-pill px-3 badge-materiales-count">
            {{ t.num_materiales }} producto{{ t.num_materiales|pluralize }}
        </span>
    </td>
    <td class="py-3 px-4 text-center">
        <div class="d-flex justify-content-center gap-2">
            <a href="{% url 'catalogo:editar_tipo_material' t.codigo_catalogo %}"
                class="btn btn-sm rounded-pill px-3 btn-table-action btn-table-action--edit"
                title="Editar">
                <i class="bi bi-pencil"></i>
            </a>
            <a href="{% url 'catalogo:eliminar_tipo_material' t.codigo_catalogo %}"
                class="btn btn-sm rounded-pill px-3 btn-table-action btn-table-action--delete confirm-delete"
                title="Eliminar" data-title="¿Eliminar tipo de material?"
                data-text="¿Estás seguro de que deseas eliminar «{{ t.nombre_empresa }}»?">
                <i class="bi bi-trash"></i>
            </a>
        </div>
    </td>
</tr>
{% empty %}
<tr>
    <td colspan="4" class="text-center py-5">
        <div class="py-5">
            <i class="bi bi-tags text-muted mb-3 d-block u-inline-8ae57e885d"></i>
            <p class="text-muted fw-medium mb-0">No se encontraron tipos de material.</p>
            <small class="text-muted">Crea uno nuevo usando el botón superior.</small>
        </div>
    </td>
</tr>
{% endfor %}
