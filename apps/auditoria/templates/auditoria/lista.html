{% extends "base.html" %}
{% load static %}

{% block title %}Auditoría - ConstruTrans{% endblock %}

{% block content %}
<div class="container-fluid p-0">
    <div class="d-flex justify-content-between align-items-center mb-5">
        <div>
            <h1 class="fw-bold text-white mb-1">
                <i class="bi bi-shield-check text-accent me-2"></i>Auditoría
            </h1>
            <p class="text-white-50 small mb-0">Registro completo de actividades del sistema.</p>
        </div>
    </div>

    <div class="table-container p-4 rounded-4 shadow-sm">
        <h5 class="mb-4 fw-bold text-white">
            <i class="bi bi-clock-history me-2 text-accent"></i>Historial de Actividades
        </h5>
        <div class="table-responsive">
            <table id="tabla-historial" class="table table-dark table-hover align-middle">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Usuario</th>
                        <th>Acción</th>
                        <th>Módulo</th>
                        <th>Elemento</th>
                        <th>Descripción</th>
                        <th>Fecha</th>
                        <th>IP</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
