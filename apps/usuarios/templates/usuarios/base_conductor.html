{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="shortcut icon" href="{% static 'img/Logo1.jpeg' %}" type="image/x-icon">

<title>{% block title %}Panel Conductor{% endblock %}</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<!-- AOS Animations -->
<link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

<!-- Animate.css -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

<!-- SweetAlert2 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">

<!-- DataTables CSS -->
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css">

<!-- Custom CSS -->
<link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
<link rel="stylesheet" href="{% static 'css/loader.css' %}">

<style>
    :root {
        /* Dashboard Dark Mode Premium - ConstruTrans */
        --color-bg: #050505;
        --color-surface: #0f1115;
        --color-primary: #3b82f6;
        --color-accent: #f97316;
        --color-text: #f8fafc;
        --color-muted: #cbd5e1;
        --color-border: rgba(255, 255, 255, 0.12);
        --color-success: #10b981;
        --color-warning: #f59e0b;
        --color-danger: #ef4444;
        --color-info: #3b82f6;
        --glow-primary: rgba(59, 130, 246, 0.2);
        --glow-accent: rgba(249, 115, 22, 0.2);
        --sidebar-bg: #0a0c10;
        --nav-active-bg: #3b82f6;
        --card-bg: #0f1115;
        --item-bg: #161a22;
        --radius-xl: 24px;
        --radius-lg: 18px;
        --shadow-soft: 0 10px 40px rgba(0, 0, 0, 0.4);
    }

    [data-theme="light"] {
        --color-bg: #f8fafc;
        --color-surface: #ffffff;
        --color-primary: #2563eb;
        --color-accent: #ea580c;
        --color-text: #0f172a;
        --color-muted: #64748b;
        --color-border: rgba(0, 0, 0, 0.08);
        --sidebar-bg: #ffffff;
        --nav-active-bg: #2563eb;
        --card-bg: #ffffff;
        --item-bg: #f1f5f9;
        --glass-bg: rgba(255, 255, 255, 0.8);
        --glass-border: rgba(0, 0, 0, 0.05);
    }

    [data-theme="accessibility"] {
        --color-bg: #000000;
        --color-surface: #000000;
        --color-primary: #ffff00;
        --color-accent: #00ffff;
        --color-text: #ffffff;
        --color-muted: #ffff00;
        --color-border: #ffffff;
        --sidebar-bg: #000000;
        --nav-active-bg: #ffff00;
        --card-bg: #000000;
        --item-bg: #000000;
        font-weight: 600;
    }

    body {
        background-color: var(--color-bg);
        color: var(--color-text);
        font-family: 'Plus Jakarta Sans', sans-serif;
        margin: 0;
        transition: background-color 0.3s, color 0.3s;
    }

    main {
        background-color: var(--color-bg) !important;
        min-height: 100vh;
    }

    .card, .navbar-custom, .sidebar-custom, .modal-content {
        background-color: var(--color-surface) !important;
        color: var(--color-text) !important;
        border-color: var(--color-border) !important;
    }

    input, select, textarea, .form-control, .form-select {
        background-color: var(--color-surface) !important;
        color: var(--color-text) !important;
        border: 1px solid var(--color-border) !important;
    }

    input:focus, select:focus, textarea:focus {
        background-color: var(--color-surface) !important;
        color: var(--color-text) !important;
        border-color: var(--color-primary) !important;
        box-shadow: 0 0 0 0.25rem rgba(59, 130, 246, 0.25) !important;
    }

    option {
        background-color: var(--color-surface) !important;
        color: var(--color-text) !important;
    }

    [data-theme="accessibility"] .btn-primary, 
    [data-theme="accessibility"] .btn-gold,
    [data-theme="accessibility"] .badge-tipo {
        color: #000000 !important;
        font-weight: 900 !important;
    }

    .text-white { color: var(--color-text) !important; }
    .text-muted { color: var(--color-muted) !important; }

    .dropdown-menu {
        z-index: 2050 !important;
    }

    [data-daltonism="protanopia"] {
        filter: url(#protanopia-filter);
    }
    [data-daltonism="deuteranopia"] {
        filter: url(#deuteranopia-filter);
    }
    [data-daltonism="tritanopia"] {
        filter: url(#tritanopia-filter);
    }
    [data-daltonism="achromatopsia"] {
        filter: grayscale(100%);
    }
    [data-daltonism="none"] {
        filter: none;
    }

    [data-font-size="small"] body, [data-font-size="small"] { font-size: 0.875rem !important; }
    [data-font-size="normal"] body, [data-font-size="normal"] { font-size: 1rem !important; }
    [data-font-size="large"] body, [data-font-size="large"] { font-size: 1.125rem !important; }
    [data-font-size="xlarge"] body, [data-font-size="xlarge"] { font-size: 1.25rem !important; }
</style>

<script src="{% static 'js/user-preferences.js' %}?v=1.0"></script>

</head>

<body>

    <!-- Loader -->
    <div id="loader-container">
        <img src="{% static 'img/Logo1.jpeg' %}" class="loader-img" alt="Cargando...">
        <div class="loader">
            <div class="progress-bar"></div>
        </div>
        <p>Cargando Panel Conductor...</p>
    </div>

<div class="container-fluid p-0">
<div class="d-flex">

{% include "partials/sidebar.html" %}

<main class="flex-grow-1 p-3 overflow-auto" style="min-height: 100vh;">

{% include "partials/navbar.html" %}

{% block content %}
{% endblock %}

</main>

</div>
</div>

<script src="https://code.jquery.com/jquery-3.7.0.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="{% static 'js/loader.js' %}"></script>

<script>
AOS.init({
    duration: 800,
    once: true,
    easing: 'ease-in-out'
});

$.fn.dataTable.ext.errMode = 'throw';

$(document).ready(function() {
    $('.table:not(.no-datatable)').DataTable({
        "language": {
            "search": "Buscar:",
            "lengthMenu": "Mostrar _MENU_ registros por página",
            "zeroRecords": "No se encontraron resultados",
            "info": "Mostrando registros del _START_ al _END_ de un total de _TOTAL_ registros",
            "infoEmpty": "No hay registros disponibles",
            "infoFiltered": "(filtrado de _MAX_ registros totales)",
            "paginate": {
                "first": "Primero",
                "last": "Último",
                "next": "Siguiente",
                "previous": "Anterior"
            }
        },
        "pageLength": 10,
        "responsive": true,
        "dom": '<"d-flex justify-content-between align-items-center mb-3"lf>rt<"d-flex justify-content-between align-items-center mt-3"ip>'
    });

    {% if messages %}
        {% for message in messages %}
            Swal.fire({
                icon: '{{ message.tags|default:"info" }}' === 'error' ? 'error' : ('{{ message.tags }}' === 'success' ? 'success' : 'info'),
                title: '{{ message.tags|title|escapejs }}',
                text: '{{ message|escapejs }}',
                toast: true,
                position: 'top-end',
                showConfirmButton: false,
                timer: 5000,
                timerProgressBar: true,
                background: '#1a1a1a',
                color: '#ffffff',
                iconColor: '{{ message.tags }}' === 'success' ? '#10b981' : ('{{ message.tags }}' === 'error' ? '#ef4444' : '#F39C12'),
                customClass: {
                    popup: 'rounded-4 border-white-10 shadow-2xl'
                }
            });
        {% endfor %}
    {% endif %}
});
</script>

<svg style="display:none">
  <defs>
    <filter id="protanopia-filter">
      <feColorMatrix type="matrix" values="0.567, 0.433, 0, 0, 0 0.558, 0.442, 0, 0, 0 0, 0.242, 0.758, 0, 0 0, 0, 0, 1, 0"/>
    </filter>
    <filter id="deuteranopia-filter">
      <feColorMatrix type="matrix" values="0.625, 0.375, 0, 0, 0 0.7, 0.3, 0, 0, 0 0, 0.3, 0.7, 0, 0 0, 0, 0, 1, 0"/>
    </filter>
    <filter id="tritanopia-filter">
      <feColorMatrix type="matrix" values="0.95, 0.05, 0, 0, 0 0, 0.433, 0.567, 0, 0 0, 0.475, 0.525, 0, 0 0, 0, 0, 1, 0"/>
    </filter>
  </defs>
</svg>

<script>
$(document).on('input', '.numeric-only', function() {
    this.value = this.value.replace(/[^0-9]/g, '');
});

$(document).on('click', '.confirm-logout', function(e) {
    e.preventDefault();
    const url = $(this).attr('href');
    
    Swal.fire({
        title: '¿Cerrar sesión?',
        text: '¿Estás seguro de que deseas salir del sistema?',
        icon: 'question',
        showCancelButton: true,
        confirmButtonColor: '#f97316',
        cancelButtonColor: '#6c757d',
        confirmButtonText: 'Sí, salir',
        cancelButtonText: 'Cancelar',
        background: '#1a1a1a',
        color: '#ffffff',
        customClass: {
            popup: 'rounded-4 border-white-10 shadow-2xl'
        }
    }).then((result) => {
        if (result.isConfirmed) {
            window.location.href = url;
        }
    });
});
</script>

{% block extra_js %}{% endblock %}

</body>
</html>
