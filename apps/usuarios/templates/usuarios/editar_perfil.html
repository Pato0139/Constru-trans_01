{% extends "base.html" %}
{% load static %}

{% block title %}Editar Perfil - Constru-trans{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card bg-dark text-white border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="card-header bg-secondary border-0 py-4 text-center">
                    <h3 class="fw-bold mb-0 u-inline-598e65ac7a">Editar Perfil</h3>
                    <p class="text-muted small mb-0">Actualiza tu información personal</p>
                </div>
                <div class="card-body p-4 p-md-5">
                    <form method="POST" enctype="multipart/form-data">
                        {% csrf_token %}
                        
                        <!-- Imagen de Perfil -->
                        <div class="text-center mb-4">
                            <div class="position-relative d-inline-block">
                                <div id="profile-preview" class="rounded-circle d-flex align-items-center justify-content-center border border-4 border-accent shadow mx-auto u-inline-bc33c42db3" 
                                     style="width: 120px; height: 120px; background-color: {{ usuario.color_avatar }}; cursor: pointer;">
                                    <span class="display-3 fw-bold text-white">{{ usuario.iniciales }}</span>
                                </div>
                                <div class="mt-3">
                                    <label for="foto_perfil" class="btn btn-sm btn-outline-accent rounded-pill px-3">
                                        <i class="bi bi-camera-fill me-2"></i> Cambiar Foto
                                    </label>
                                    <input type="file" id="foto_perfil" name="foto_perfil" class="d-none">
                                </div>
                            </div>
                        </div>

                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-muted">Nombres</label>
                                <input type="text" name="nombres" value="{{ usuario.nombres }}" class="form-control bg-secondary border-0 text-white rounded-3 py-2" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-muted">Apellidos</label>
                                <input type="text" name="apellidos" value="{{ usuario.apellidos }}" class="form-control bg-secondary border-0 text-white rounded-3 py-2" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label small fw-bold text-muted">Correo Electrónico</label>
                                <input type="email" name="email" value="{{ request.user.email }}" class="form-control bg-secondary border-0 text-white rounded-3 py-2" required>
                            </div>
                            <div class="col-md-5">
                                <label class="form-label small fw-bold text-muted">País</label>
                                <select name="pais_codigo" class="form-select bg-secondary border-0 text-white rounded-3 py-2" id="paisCodigo">
                                    <option value="+57" selected>COL (+57)</option>
                                    <option value="+1">USA (+1)</option>
                                    <option value="+52">MEX (+52)</option>
                                    <option value="+54">ARG (+54)</option>
                                    <option value="+34">ESP (+34)</option>
                                    <option value="+56">CHL (+56)</option>
                                </select>
                            </div>
                            <div class="col-md-7">
                                <label class="form-label small fw-bold text-muted">Teléfono</label>
                                <input type="text" name="telefono" value="{{ usuario.telefono }}" class="form-control bg-secondary border-0 text-white rounded-3 py-2"
                                pattern="[0-9\s]*" title="Solo se admiten números y espacios" oninput="this.value = this.value.replace(/[^0-9\s]/g, '')">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-muted">Tipo Documento</label>
                                <select name="tipo_documento" class="form-select bg-secondary border-0 text-white rounded-3 py-2">
                                    {% for code, name in usuario.TIPOS_DOCUMENTO %}
                                        <option value="{{ code }}" {% if usuario.tipo_documento == code %}selected{% endif %}>{{ name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-12">
                                <label class="form-label small fw-bold text-muted">Número de Identificación</label>
                                <input type="text" name="documento" value="{{ usuario.documento }}" class="form-control bg-secondary border-0 text-white rounded-3 py-2" required
                                pattern="[0-9\s]*" title="Solo se admiten números y espacios" oninput="this.value = this.value.replace(/[^0-9\s]/g, '')">
                            </div>
                        </div>

                        <div class="d-grid gap-2 mt-5">
                            <button type="submit" class="btn btn-accent fw-bold py-3 rounded-pill shadow-sm" aria-label="Enviar formulario" data-tooltip="Enviar formulario" title="Enviar formulario">
                                Guardar Cambios
                            </button>
                            <a href="javascript:history.back()" class="btn btn-outline-light py-3 rounded-pill">
                                Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    :root {
        --color-accent: #F39C12;
    }
    .btn-accent {
        background-color: var(--color-accent);
        color: #000;
        border: none;
    }
    .btn-accent:hover {
        background-color: #d68910;
        color: #000;
    }
    .btn-outline-accent {
        color: var(--color-accent);
        border-color: var(--color-accent);
    }
    .btn-outline-accent:hover {
        background-color: var(--color-accent);
        color: #000;
    }
    .bg-dark {
        background-color: #000000 !important;
    }
    .bg-secondary {
        background-color: #333333 !important;
    }
    .border-accent {
        border-color: var(--color-accent) !important;
    }
    .form-control:focus, .form-select:focus {
        background-color: #444444 !important;
        box-shadow: 0 0 0 0.25rem rgba(243, 156, 18, 0.25);
        border: none;
        color: white;
    }
</style>

<script>
    // Aceptar cualquier archivo sin restricciones de tipo
    document.getElementById('foto_perfil').addEventListener('change', function (evt) {
        const [file] = this.files;
        if (file) {
            // Solo validar tamaño
            if (file.size > 100 * 1024 * 1024) {
                alert('El archivo es demasiado grande. El tamaño máximo es 100MB.');
                this.value = '';
                return;
            }
            
            // Mostrar previsualización si es imagen
            if (file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById('profile-preview');
                    preview.innerHTML = `<img src="${e.target.result}" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;">`;
                };
                reader.readAsDataURL(file);
            }
        }
    });
</script>
{% endblock %}
