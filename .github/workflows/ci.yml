name: CI

on:
  push:
    branches: [main, develop, 'GRUPO_7_ADSO/**']
  pull_request:
    branches: [main, develop, 'GRUPO_7_ADSO/**']

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports: ['5432:5432']
        options: --health-cmd pg_isready
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: ruff check .
      - name: Secret scan
        run: |
          python - <<'PY'
          import pathlib
          import re
          root = pathlib.Path('.')
          offenders = []
          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.name == '.env.example':
                  continue
              if path.suffix in {'.py', '.txt', '.yml', '.yaml', '.toml', '.ini', '.cfg'}:
                  text = path.read_text(errors='ignore')
                  if re.search(r'(SECRET_KEY\s*[:=]|PASSWORD\s*[:=]|API_KEY\s*[:=]|TOKEN\s*[:=])', text, re.I):
                      offenders.append(str(path))
          if offenders:
              print('Potential secrets found:')
              for item in offenders:
                  print(item)
              raise SystemExit(1)
          print('No obvious secret values found in tracked source files.')
          PY
      - run: pytest
        env:
          DATABASE_URL: postgresql://postgres:testpass@localhost:5432/testdb
          SECRET_KEY: test-secret-key
          DEBUG: 'True'
