[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
  ".venv",
  "venv",
  "staticfiles",
  "htmlcov",
  "media",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "DJ"]
ignore = [
  "E501",   # el limite de linea lo controla ruff-format
  "DJ001",  # los CharField existentes usan null=True por compatibilidad con Neon
  "DJ012",  # orden de metodos de los modelos heredados
  "E402",   # import local en scripts y comandos de datos
]

[tool.ruff.lint.per-file-ignores]
"ia/services/math_service.py" = ["N802"]
"**/migrations/*" = ["E501", "F401", "I001", "N999"]
"**/__init__.py" = ["F401", "F403"]
"config/settings/*" = ["F405"]
"verificar_rubrica.py" = ["F401", "F841", "W291", "W293", "E722"]
"scripts/**" = ["F401", "F841", "W293", "E722"]
"ñ**" = []

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "config.settings.dev"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
testpaths = [
  "apps/usuarios",
  "apps/clientes",
  "apps/catalogo",
  "apps/compras",
  "apps/pedidos",
  "apps/pagos",
  "apps/logistica",
  "apps/auditoria",
  "apps/reportes",
  "apps/inicio",
  "apps/licensing",
  "apps/ia",
  "apps/ayuda",
]
python_files = ["tests.py", "test_*.py", "*_tests.py"]
norecursedirs = [".venv", "venv", "scripts", "htmlcov", "staticfiles", "media"]
addopts = "--cov=apps.usuarios --cov=apps.clientes --cov=apps.catalogo --cov=apps.compras --cov=apps.pedidos --cov=apps.pagos --cov=apps.logistica --cov=apps.auditoria --cov=apps.reportes --cov=apps.inicio --cov=apps.licensing --cov=apps.ia --cov=apps.ayuda --cov-report=html --cov-report=term"

