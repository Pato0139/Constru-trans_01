[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "DJ"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"ia/services/math_service.py" = ["N802"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "config.settings.dev"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
testpaths = [
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
testpaths = [
  "apps/usuarios",
  "apps/clientes",
  "apps/catalogo",
  "apps/compras",
  "apps/pedidos",
  "apps/pagos",
  "apps/facturacion",
  "apps/logistica",
  "apps/auditoria",
  "apps/reportes",
  "apps/inicio",
  "apps/licensing",
  "apps/ia",
  "apps/ordenes",
  "apps/gestion_pedidos",
  "apps/inventario",
  "apps/historial",
  "apps/transporte"
]
python_files = ["tests.py", "test_*.py", "*_tests.py"]
norecursedirs = [".venv", "scripts", "htmlcov", "staticfiles"]
addopts = "--cov=apps.usuarios --cov=apps.clientes --cov=apps.catalogo --cov=apps.compras --cov=apps.pedidos --cov=apps.pagos --cov=apps.facturacion --cov=apps.logistica --cov=apps.auditoria --cov=apps.reportes --cov=apps.inicio --cov=apps.licensing --cov=apps.ia --cov=apps.ordenes --cov=apps.gestion_pedidos --cov=apps.inventario --cov=apps.historial --cov=apps.transporte --cov-report=html --cov-report=term"
