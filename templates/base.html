        --sidebar-gradient: linear-gradient(180deg, #ffffff 0%, #f8fafc 50%, #f1f5f9 100%);
        --sidebar-border: rgba(15, 23, 42, 0.08);
        --sidebar-footer-bg: #f1f5f9;
        --sidebar-section-bg: rgba(15, 23, 42, 0.04);
        --main-bg: linear-gradient(160deg, #f8fafc 0%, #f1f5f9 50%, #e2e8f0 100%);
        --main-glow: radial-gradient(ellipse at top right, rgba(30, 64, 175, 0.06) 0%, transparent 70%);
        --navbar-bg: rgba(255, 255, 255, 0.96);
        --nav-active-bg: linear-gradient(135deg, #1e40af 0%, #f59e0b 100%);
        --nav-link-color: #475569;
        --nav-link-muted: #64748b;
        --nav-link-parent: #334155;
        --card-bg: #ffffff;
        --card-bg-alt: #f8fafc;
        --item-bg: #f1f5f9;
        --item-bg-hover: #e2e8f0;

    }

    [data-theme="light"] .dropdown-menu-dark {
        --bs-dropdown-bg: #ffffff;
        --bs-dropdown-color: #0f172a;
        --bs-dropdown-link-color: #334155;
        --bs-dropdown-link-hover-color: #0f172a;

    }

    [data-theme="light"] .sidebar-custom .btn-link {
        color: var(--color-text) !important;
    }

    /* Sidebar: forzar tema claro completo (evita degradado oscuro residual) */
    html[data-theme="light"] #sidebar.sidebar-custom,
    html[data-theme="light"] .sidebar-custom {
        background: #f8fafc !important;

        border-right: 1px solid rgba(15, 23, 42, 0.1) !important;

    }

    html[data-theme="light"] .sidebar-brand-card {

    }

    [data-theme="light"] .text-muted,

    }

        --bs-table-color: #0f172a;
    }

    [data-theme="light"] .table-dark td {
        color: #0f172a !important;
    }

    [data-theme="light"] .btn-dark-premium {
        background-color: #f1f5f9 !important;
        border-color: #64748b !important;
        color: #0f172a !important;
    }

    /* Estilos base para botón dark-premium (modo oscuro por defecto) */
    .btn-dark-premium {
        background: rgba(255, 255, 255, 0.03) !important;
        border: 1px solid rgba(255, 255, 255, 0.05) !important;
        color: #ffffff !important;
        transition: all 0.3s ease;
    }

    .btn-dark-premium:hover {
        background: rgba(255, 255, 255, 0.08) !important;
        border-color: var(--color-primary) !important;
        transform: translateY(-1px);
    }

    .btn-dark-premium i,
    .btn-dark-premium span {
        color: #ffffff !important;
    }

    [data-theme="light"] .btn-dark-premium {
        background-color: #f1f5f9 !important;
        border-color: #64748b !important;
        color: #0f172a !important;
    }

    [data-theme="light"] .btn-dark-premium:hover {
        background-color: #e2e8f0 !important;
        border-color: #1e40af !important;
    }

    [data-theme="light"] .btn-dark-premium i,
    [data-theme="light"] .btn-dark-premium span {
        color: #0f172a !important;
    }

    [data-theme="accessibility"] {
        --color-bg: #000000;
        --color-surface: #000000;
        --color-primary: #ffff00;
        --color-accent: #00ffff;
        --color-text: #ffffff !important;
        --color-muted: #ffff00 !important;
        --color-border: #ffffff;
        --sidebar-bg: #000000;
        --nav-active-bg: #ffff00;
        --card-bg: #000000;
        --item-bg: #000000;
        font-weight: 600;
        font-family: 'Plus Jakarta Sans', sans-serif !important;
    }

    html[data-theme="accessibility"] .text-white {
        color: #ffffff !important;
    }

    html[data-theme="accessibility"] .text-muted,
    html[data-theme="accessibility"] .text-white-50 {
        color: #ffff00 !important;
    }

    html[data-theme="accessibility"] .btn-outline-info,
    html[data-theme="accessibility"] .btn-outline-warning {
        color: #000000 !important;
        background-color: #ffff00 !important;
        border-color: #ffff00 !important;
    }

    html[data-theme="accessibility"] .badge {
        color: #000000 !important;
        background-color: #ffff00 !important;
    }

    html[data-theme="accessibility"] input,
    html[data-theme="accessibility"] select,
    html[data-theme="accessibility"] textarea,
    html[data-theme="accessibility"] .form-control,
    html[data-theme="accessibility"] .form-select {
        color: #ffffff !important;
        background-color: #000000 !important;
        border-color: #ffff00 !important;
    }

    html[data-theme="accessibility"] .table-dark {
        --bs-table-bg: #000000 !important;
        --bs-table-color: #ffffff !important;
    }

    html[data-theme="accessibility"] .table-dark th,
    html[data-theme="accessibility"] .table-dark td {
        color: #ffffff !important;
        background-color: #000000 !important;
    }

    html[data-theme="accessibility"] .btn-dark-premium {
        background-color: #000000 !important;
        border-color: #ffff00 !important;
        color: #ffffff !important;
    }

    html[data-theme="accessibility"] .btn-dark-premium:hover {
        background-color: #ffff00 !important;
        color: #000000 !important;
    }

    html[data-theme="accessibility"] .btn-dark-premium i,
    html[data-theme="accessibility"] .btn-dark-premium span {
        color: #ffffff !important;
    }

    html[data-theme="accessibility"] .btn-dark-premium:hover i,
    html[data-theme="accessibility"] .btn-dark-premium:hover span {
        color: #000000 !important;
    }

    html[data-theme="accessibility"] .dropdown-menu-dark {
        background-color: #000000 !important;
        border-color: #ffff00 !important;
    }

    html[data-theme="accessibility"] .dropdown-menu-dark .dropdown-item {
        color: #ffffff !important;
    }

    html[data-theme="accessibility"] .dropdown-menu-dark .dropdown-item:hover {
        background-color: #ffff00 !important;
        color: #000000 !important;
    }

    /* Override muy específico para modo accesibilidad */
    html[data-theme="accessibility"] body {
        color: #ffffff !important;
        background-color: #000000 !important;
    }

    html[data-theme="accessibility"] h1,
    html[data-theme="accessibility"] h2,
    html[data-theme="accessibility"] h3,
    html[data-theme="accessibility"] h4,
    html[data-theme="accessibility"] h5,
    html[data-theme="accessibility"] h6,
    html[data-theme="accessibility"] p,
    html[data-theme="accessibility"] span,
    html[data-theme="accessibility"] div,
    html[data-theme="accessibility"] li,
    html[data-theme="accessibility"] a,
    html[data-theme="accessibility"] label {
        color: #ffffff !important;
    }

    html[data-theme="accessibility"] small {
        color: #ffff00 !important;
    }

    /* --- SVG FILTERS PARA DALTONISMO --- */
    /* Estos filtros se inyectan al final del body */

    body {
        background-color: var(--color-bg);
        color: var(--color-text);
        font-family: 'Plus Jakarta Sans', sans-serif;
        margin: 0;
        transition: background-color 0.3s, color 0.3s, font-size 0.2s ease;
    }
    
    [data-font-size="small"] body,
    [data-font-size="small"] {
        font-size: 0.875rem !important;
    }
    
    [data-font-size="normal"] body,
    [data-font-size="normal"] {
        font-size: 1rem !important;
    }
    
    [data-font-size="large"] body,
    [data-font-size="large"] {
        font-size: 1.125rem !important;
    }
    
    [data-font-size="xlarge"] body,
    [data-font-size="xlarge"] {
        font-size: 1.25rem !important;
    }
    
    [data-font-size="small"] h1, [data-font-size="small"] h2, [data-font-size="small"] h3,
    [data-font-size="small"] h4, [data-font-size="small"] h5, [data-font-size="small"] h6 {
        font-size: calc(1em * 0.875) !important;
    }
    
    [data-font-size="large"] h1, [data-font-size="large"] h2, [data-font-size="large"] h3,
    [data-font-size="large"] h4, [data-font-size="large"] h5, [data-font-size="large"] h6 {
        font-size: calc(1em * 1.125) !important;
    }
    
    [data-font-size="xlarge"] h1, [data-font-size="xlarge"] h2, [data-font-size="xlarge"] h3,
    [data-font-size="xlarge"] h4, [data-font-size="xlarge"] h5, [data-font-size="xlarge"] h6 {
        font-size: calc(1em * 1.25) !important;
    }

    main {
        background-color: var(--color-bg) !important;
        min-height: 100vh;
    }

    .card, .navbar-custom, .modal-content {
        background-color: var(--color-surface) !important;
        color: var(--color-text) !important;
        border-color: var(--color-border) !important;
    }

    .sidebar-custom {
        background: var(--sidebar-gradient, var(--sidebar-bg)) !important;
        color: var(--color-text) !important;
        border-color: var(--sidebar-border) !important;
    }

    /* Estilos para inputs, select y textarea */
    input, select, textarea, .form-control, .form-select {
        background-color: var(--color-surface) !important;
        color: var(--color-text) !important;
        border: 1px solid var(--color-border) !important;
    }

    input:focus, select:focus, textarea:focus {
        background-color: var(--color-surface) !important;
        color: var(--color-text) !important;
        border-color: var(--color-primary) !important;
        box-shadow: 0 0 0 0.25rem rgba(59, 130, 246, 0.25) !important;
    }

    /* Estilo para las opciones del select */
    option {
        background-color: var(--color-surface) !important;
        color: var(--color-text) !important;
    }

    /* Para asegurar que en modo oscuro/accesibilidad sea negro total si se requiere */
    /* Forzar texto negro en botones amarillos para alto contraste */
    [data-theme="accessibility"] .btn-primary, 
    [data-theme="accessibility"] .btn-gold,
    [data-theme="accessibility"] .badge-tipo {
        color: #000000 !important;
        font-weight: 900 !important;
    }

    .text-white { color: var(--color-text) !important; }
    .text-muted { color: var(--color-muted) !important; }

    /* Forzar que los dropdowns de Bootstrap salgan siempre al frente */
    .dropdown-menu {
        z-index: 2050 !important;
    }

    /* --- APLICAR FILTROS DE DALTONISMO --- */
    [data-daltonism="protanopia"] {
        filter: url(#protanopia-filter);
    }
    [data-daltonism="deuteranopia"] {
        filter: url(#deuteranopia-filter);
    }
    [data-daltonism="tritanopia"] {
        filter: url(#tritanopia-filter);
    }
    [data-daltonism="achromatopsia"] {
        filter: grayscale(100%);
    }
    [data-daltonism="none"] {
        filter: none;
    }

    /* Estilo Premium para inputs de fecha en todo el sitio */
    input[type="date"] {
        position: relative;
    }

    /* Ocultar el icono nativo de calendario y hacerlo expandible en todo el input */
    input[type="date"]::-webkit-calendar-picker-indicator {
        background: transparent;
        bottom: 0;
        color: transparent;
        cursor: pointer;
        height: auto;
        left: 0;
        position: absolute;
        right: 0;
        top: 0;
        width: auto;
        z-index: 2;
    }

    /* Tooltips customization */
    .tooltip-inner {
        background-color: var(--color-accent) !important;
        color: #000 !important;
        font-weight: 700;
    }
</style>

<script src="{% static 'js/user-preferences.js' %}?v=1.1"></script>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="container-fluid p-0">
<div class="d-flex">

{% include "partials/sidebar.html" %}

<main class="main-content app-main flex-grow-1 p-3 overflow-auto">

{% include "partials/navbar.html" %}

{% block content %}
{% endblock %}

{% include "partials/footer.html" %}

</main>

</div>
</div>

<script src="https://code.jquery.com/jquery-3.7.0.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
// Initialize AOS
    AOS.init({
        duration: 800,
        once: true,
        easing: 'ease-in-out'
    });

    // Sidebar Toggle Functionality
    const sidebarToggle = document.getElementById('sidebarToggle');
    const sidebarClose = document.getElementById('sidebarClose');
    const sidebar = document.getElementById('sidebar');
    const sidebarOverlay = document.getElementById('sidebarOverlay');

    if (sidebarToggle) {
        sidebarToggle.addEventListener('click', () => {
            sidebar.classList.add('active');
            sidebarOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        });
    }

    if (sidebarClose) {
        sidebarClose.addEventListener('click', () => {
            sidebar.classList.remove('active');
            sidebarOverlay.classList.remove('active');
            document.body.style.overflow = 'auto';
        });
    }

    if (sidebarOverlay) {
        sidebarOverlay.addEventListener('click', () => {
            sidebar.classList.remove('active');
            sidebarOverlay.classList.remove('active');
            document.body.style.overflow = 'auto';
        });
    }

// Desactivar alertas de DataTables y redirigirlas a la consola para evitar ventanas emergentes
$.fn.dataTable.ext.errMode = 'throw';

$(document).ready(function() {
    $('.table:not(.no-datatable)').DataTable({
        "language": {
            "search": "Buscar:",
            "lengthMenu": "Mostrar _MENU_ registros por página",
            "zeroRecords": "No se encontraron resultados",
            "info": "Mostrando registros del _START_ al _END_ de un total de _TOTAL_ registros",
            "infoEmpty": "No hay registros disponibles",
            "infoFiltered": "(filtrado de _MAX_ registros totales)",
            "paginate": {
                "first": "Primero",
                "last": "Último",
                "next": "Siguiente",
                "previous": "Anterior"
            }
        },
        "pageLength": 10,
        "responsive": true,
        "dom": '<"d-flex justify-content-between align-items-center mb-3"lf>rt<"d-flex justify-content-between align-items-center mt-3"ip>'
    });

    // Custom SweetAlert for Django Messages
    {% if messages %}
        {% for message in messages %}
            Swal.fire({
                icon: '{{ message.tags|default:"info" }}' === 'error' ? 'error' : ('{{ message.tags }}' === 'success' ? 'success' : 'info'),
                title: '{{ message.tags|title|escapejs }}',
                text: '{{ message|escapejs }}',
                toast: true,
                position: 'top-end',
                showConfirmButton: false,
                timer: 5000,
                timerProgressBar: true,
                background: '#1a1a1a',
                color: '#ffffff',
                iconColor: '{{ message.tags }}' === 'success' ? '#10b981' : ('{{ message.tags }}' === 'error' ? '#ef4444' : '#F39C12'),
                customClass: {
                    popup: 'rounded-4 border-white-10 shadow-2xl'
                }
            });
        {% endfor %}
    {% endif %}
});
</script>

<!-- SVG Filters for Daltonism -->
<svg style="display:none">
  <defs>
    <filter id="protanopia-filter">
      <feColorMatrix type="matrix" values="0.567, 0.433, 0, 0, 0 0.558, 0.442, 0, 0, 0 0, 0.242, 0.758, 0, 0 0, 0, 0, 1, 0"/>
    </filter>
    <filter id="deuteranopia-filter">
      <feColorMatrix type="matrix" values="0.625, 0.375, 0, 0, 0 0.7, 0.3, 0, 0, 0 0, 0.3, 0.7, 0, 0 0, 0, 0, 1, 0"/>
    </filter>
    <filter id="tritanopia-filter">
      <feColorMatrix type="matrix" values="0.95, 0.05, 0, 0, 0 0, 0.433, 0.567, 0, 0 0, 0.475, 0.525, 0, 0 0, 0, 0, 1, 0"/>
    </filter>
  </defs>
</svg>

<script>
// Global Input Validation
$(document).on('input', '.numeric-only', function() {
    this.value = this.value.replace(/[^0-9]/g, '');
});

$(document).on('input', '.decimal-only', function() {
    let value = this.value.replace(/[^0-9\.,]/g, '');
    value = value.replace(/,/g, '.');
    const parts = value.split('.');
    if (parts.length > 2) {
        value = parts.shift() + '.' + parts.join('');
    }
    if (value.includes('.')) {
        const [intPart, decPart] = value.split('.');
        value = intPart + '.' + decPart.slice(0, 2);
    }
    this.value = value;
});

$(document).on('input', '.alphanumeric-only', function() {
    this.value = this.value.replace(/[^a-zA-Z0-9]/g, '');
});

$(document).on('input', '.plate-only', function() {
    // Alfanumérico y mayúsculas para placas
    this.value = this.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
});

// Global Logout Confirmation
$(document).on('click', '.confirm-logout', function(e) {
    e.preventDefault();
    const url = $(this).attr('href');
    
    Swal.fire({
        title: '¿Cerrar sesión?',
        text: '¿Estás seguro de que deseas salir del sistema?',
        icon: 'question',
        showCancelButton: true,
        confirmButtonColor: '#f97316',
        cancelButtonColor: '#6c757d',
        confirmButtonText: 'Sí, salir',
        cancelButtonText: 'Cancelar',
        background: '#1a1a1a',
        color: '#ffffff',
        customClass: {
            popup: 'rounded-4 border-white-10 shadow-2xl'
        }
    }).then((result) => {
        if (result.isConfirmed) {
            window.location.href = url;
        }
    });
});

// Global Delete Confirmation with SweetAlert2 (Forms)
$(document).on('click', '.confirm-delete-form', function(e) {
    e.preventDefault();
    const form = $(this).closest('form');
    const title = $(this).data('title') || '¿Estás seguro?';
    const text = $(this).data('text') || 'Esta acción no se puede deshacer.';
    
    Swal.fire({
        title: title,
        text: text,
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#ef4444',
        cancelButtonColor: '#6c757d',
        confirmButtonText: 'Sí, continuar',
        cancelButtonText: 'Cancelar',
        background: '#1a1a1a',
        color: '#ffffff',
        customClass: {
            popup: 'rounded-4 border-white-10 shadow-2xl'
        }
    }).then((result) => {
        if (result.isConfirmed) {
            form.submit();
        }
    });
});

// Global Delete Confirmation with SweetAlert2 (Links)
$(document).on('click', '.confirm-delete', function(e) {
    e.preventDefault();
    const url = $(this).attr('href');
    const title = $(this).data('title') || '¿Estás seguro?';
    const text = $(this).data('text') || 'Esta acción no se puede deshacer.';
    
    Swal.fire({
        title: title,
        text: text,
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#ef4444',
        cancelButtonColor: '#6c757d',
        confirmButtonText: 'Sí, eliminar',
        cancelButtonText: 'Cancelar',
        background: '#1a1a1a',
        color: '#ffffff',
        customClass: {
            popup: 'rounded-4 border-white-10 shadow-2xl'
        }
    }).then((result) => {
        if (result.isConfirmed) {
            window.location.href = url;
        }
    });
});
</script>

{% block extra_js %}{% endblock %}

</body>
</html>
