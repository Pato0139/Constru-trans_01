<div class="auth-db-strip">
    {% include "partials/bd_mode_toggle.html" with bd_toggle_layout='login' %}
</div>

{% if modo_local %}
<div class="auth-alert auth-alert--warn">
    <i class="bi bi-hdd-network-fill flex-shrink-0"></i>
    <div><strong>Local</strong></div>
</div>
{% elif bd_usando_remota %}
<div class="auth-alert auth-alert--info">
    <i class="bi bi-cloud-check-fill flex-shrink-0"></i>
    <div><strong>Remoto</strong></div>
</div>
{% endif %}
