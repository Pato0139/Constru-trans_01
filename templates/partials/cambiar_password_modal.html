<!-- Modal unificado: Cambiar Contraseña (funciona en Admin, Cliente y Conductor) -->
<div class="modal fade" id="cambiarPasswordModal" tabindex="-1" aria-labelledby="cambiarPasswordLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content ct-pw-modal-content">
            <div class="modal-header border-bottom border-secondary border-opacity-25">
                <h5 class="modal-title fw-bold d-flex align-items-center gap-2" id="cambiarPasswordLabel">
                    <i class="bi bi-shield-lock-fill text-warning"></i> Cambiar Contraseña
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <form id="ctChangePasswordForm" method="POST" action="{% url 'usuarios:cambiar_password_perfil' %}">
                {% csrf_token %}
                <div class="modal-body p-4">
                    <div id="ctPwFeedback" class="alert d-none py-2 px-3 small mb-3" role="alert"></div>

                    <div class="mb-3">
                        <label for="ctOldPassword" class="form-label small fw-bold text-uppercase">Contraseña actual</label>
                        <input type="password" name="old_password" id="ctOldPassword" class="form-control" required autocomplete="current-password" placeholder="Ingresa tu contraseña actual">
                    </div>
                    <div class="mb-3">
                        <label for="ctNewPassword1" class="form-label small fw-bold text-uppercase">Nueva contraseña</label>
                        <input type="password" name="new_password1" id="ctNewPassword1" class="form-control" required autocomplete="new-password" placeholder="Mínimo 8 caracteres">
                    </div>
                    <div class="mb-1">
                        <label for="ctNewPassword2" class="form-label small fw-bold text-uppercase">Confirmar nueva contraseña</label>
                        <input type="password" name="new_password2" id="ctNewPassword2" class="form-control" required autocomplete="new-password" placeholder="Repite tu nueva contraseña">
                    </div>
                </div>
                <div class="modal-footer border-top border-secondary border-opacity-25">
                    <button type="button" class="ct-profile-btn ct-profile-btn--outline-slate" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" id="ctPwSubmitBtn" class="ct-profile-btn ct-profile-btn--solid-gold">
                        <i class="bi bi-check-circle-fill"></i> Guardar clave
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
    const pwForm = document.getElementById('ctChangePasswordForm');
    if (pwForm && pwForm.dataset.bound !== '1') {
        pwForm.dataset.bound = '1';
        const feedback = document.getElementById('ctPwFeedback');
        const submitBtn = document.getElementById('ctPwSubmitBtn');

        pwForm.addEventListener('submit', async function (e) {
            e.preventDefault();
            if (feedback) {
                feedback.className = 'alert d-none py-2 px-3 small mb-3';
                feedback.textContent = '';
            }
            if (submitBtn) submitBtn.disabled = true;

            try {
                const resp = await fetch(pwForm.action, {
                    method: 'POST',
                    body: new FormData(pwForm),
                    headers: { 'X-Requested-With': 'XMLHttpRequest' },
                    credentials: 'same-origin',
                });
                const data = await resp.json();
                if (resp.ok && data.ok) {
                    pwForm.reset();
                    if (feedback) {
                        feedback.className = 'alert alert-success py-2 px-3 small mb-3';
                        feedback.textContent = data.message || 'Contraseña actualizada correctamente.';
                    }
                    setTimeout(() => {
                        const modalEl = document.getElementById('cambiarPasswordModal');
                        if (modalEl && window.bootstrap) {
                            const inst = bootstrap.Modal.getInstance(modalEl);
                            if (inst) inst.hide();
                        }
                    }, 900);
                } else {
                    if (feedback) {
                        feedback.className = 'alert alert-danger py-2 px-3 small mb-3';
                        feedback.textContent = data.error || 'Revisa los datos ingresados.';
                    }
                }
            } catch (_err) {
                if (feedback) {
                    feedback.className = 'alert alert-danger py-2 px-3 small mb-3';
                    feedback.textContent = 'Error de conexión al actualizar la contraseña.';
                }
            } finally {
                if (submitBtn) submitBtn.disabled = false;
            }
        });
    }

    // Subida instantánea de foto desde el avatar
    const photoInput = document.getElementById('ctAvatarFileInput');
    const photoForm = document.getElementById('ctAvatarUploadForm');
    if (photoInput && photoForm && photoInput.dataset.bound !== '1') {
        photoInput.dataset.bound = '1';
        photoInput.addEventListener('change', function () {
            if (photoInput.files && photoInput.files.length > 0) {
                photoForm.submit();
            }
        });
    }
});
</script>
