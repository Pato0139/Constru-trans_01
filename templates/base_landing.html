{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Constru-trans | Logística de Élite{% endblock %}</title>
    <link rel="icon" href="{% static 'img/icon.png' %}?v=3" type="image/png">
    <link rel="shortcut icon" href="{% static 'img/icon.png' %}?v=3" type="image/png">

    <!-- Bootstrap 5 -->
    <link href="{% static 'vendor/bootstrap/bootstrap.min.css' %}" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'vendor/bootstrap-icons/bootstrap-icons.css' %}">

    <!-- AOS & Animate.css -->
    <link href="{% static 'vendor/aos/aos.css' %}" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'vendor/animate/animate.min.css' %}" />

    <!-- Custom Styles -->
    <link rel="stylesheet" href="{% static 'css/principal.css' %}?v=2.2">
    <link rel="stylesheet" href="{% static 'css/loader.css' %}">
    <link rel="stylesheet" href="{% static 'css/inline-migrated.css' %}?v=1.1">
    {% block extra_css %}{% endblock %}
    <link rel="stylesheet" href="{% static 'css/responsive.css' %}?v=5.5">
</head>

<body data-ajax-shell="public">

    <div id="loader-container">
        <img src="{% static 'img/Logo1.jpeg' %}?v=2" class="loader-img" alt="Cargando..." loading="lazy">
        <div class="loader">
            <div class="progress-bar"></div>
        </div>
    </div>

    {% include "partials/landing_navbar.html" %}

    <main>
        <div data-ajax-content>
            {% block content %}
            {% endblock %}
        </div>
    </main>

    {% include "partials/landing_footer.html" %}

    <!-- Bootstrap JS (bundle incluye Popper) -->
    <script src="{% static 'vendor/bootstrap/bootstrap.bundle.min.js' %}"></script>
    <script src="{% static 'vendor/jquery/jquery-3.7.0.min.js' %}"></script>
    <script src="{% static 'vendor/aos/aos.js' %}"></script>
    <script src="{% static 'js/core/ajax-navigation.js' %}?v=1.1"></script>
    <script src="{% static 'js/loader.js' %}"></script>
    <script src="{% static 'js/landing.js' %}?v=1.2"></script>
    <script src="{% static 'js/tooltips.js' %}?v=1.0"></script>
    {% block extra_js %}{% endblock %}
</body>

</html>
