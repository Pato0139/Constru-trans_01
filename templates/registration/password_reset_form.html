{% extends "base.html" %}
{% block content %}
<div class="card mx-auto" style="max-width: 480px; margin-top: 60px;">
  <div class="card-body">
    <h3 class="card-title mb-3">Recuperar contraseña</h3>
    <p class="text-muted">
      Ingresa tu correo registrado y te enviaremos un enlace para
      restablecer tu contraseña.
    </p>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary w-100">Enviar enlace</button>
    </form>
    <a href="{% url 'login' %}" class="d-block text-center mt-3">
      Volver al login
    </a>
  </div>
</div>
{% endblock %}
