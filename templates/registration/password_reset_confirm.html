{% extends "base.html" %}
{% block content %}
<div class="card mx-auto" style="max-width: 480px; margin-top: 60px;">
  <div class="card-body">
    {% if validlink %}
      <h3>Nueva contraseña</h3>
      <p class="text-muted">Define tu nueva contraseña.</p>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary w-100">Cambiar contraseña</button>
      </form>
    {% else %}
      <h3>Enlace inválido</h3>
      <p>El enlace expiró o ya fue usado.</p>
      <a href="{% url 'password_reset' %}" class="btn btn-link">
        Solicitar uno nuevo
      </a>
    {% endif %}
  </div>
</div>
{% endblock %}
