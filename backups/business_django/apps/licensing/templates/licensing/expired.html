{% extends "base.html" %}

{% block title %}Licencia Expirada{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg border-0">
                <div class="card-body p-5 text-center">
                    <i class="bi bi-shield-lock" style="font-size: 4rem; color: #dc2626;"></i>
                    <h2 class="mt-4 mb-3">Licencia Expirada o Invalida</h2>
                    <p class="text-muted mb-4">
                        Tu licencia ha expirado o el sistema ha detectado alteraciones. 
                        Por favor contacta con el administrador para reactivar tu acceso.
                    </p>
                    <a href="{% url 'inicio:inicio' %}" class="btn btn-primary">
                        Volver al Inicio
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
