{% extends "base.html" %}
{% load static %}

{% block title %}Editar Perfil - Constru-trans{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden u-inline-11d9ca5a15">
                <div class="card-header border-0 py-4 text-center u-inline-2286cd84e7">
                    <h3 class="fw-bold mb-0 u-inline-598e65ac7a">Editar Perfil</h3>
                    <p class="text-muted small mb-0">Actualiza tu información personal</p>
                </div>
                <div class="card-body p-4 p-md-5">
                    <form method="POST" enctype="multipart/form-data">
                        {% csrf_token %}
                        
                        <!-- Imagen de Perfil -->
                        <div class="text-center mb-4">
                            <div class="position-relative d-inline-block edit-profile-avatar-container">
                            {% if usuario.foto_perfil %}
                                <img id="avatar-preview" src="{{ usuario.foto_perfil.url }}" class="edit-profile-avatar-img" alt="Avatar">
                            {% else %}
                                <div class="edit-profile-avatar-placeholder" id="avatar-preview">
                                    <span class="display-3 fw-bold">{{ usuario.iniciales }}</span>
                                </div>
                            {% endif %}
                            <div class="mt-3">
                                <label for="foto_perfil" class="btn btn-sm btn-outline-accent rounded-pill px-3">
                                        <i class="bi bi-camera-fill me-2"></i> Cambiar Foto
                                    </label>
                                    <input type="file" id="foto_perfil" name="foto_perfil" class="d-none">
                                </div>
                            </div>
                        </div>

                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label small fw-bold u-inline-9bca4b1fbc">Nombres</label>
                                <input type="text" name="nombres" value="{{ usuario.nombres }}" class="form-control rounded-3 py-2 u-inline-b4973e868e" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold u-inline-9bca4b1fbc">Apellidos</label>
                                <input type="text" name="apellidos" value="{{ usuario.apellidos }}" class="form-control rounded-3 py-2 u-inline-b4973e868e" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label small fw-bold u-inline-9bca4b1fbc">Correo Electrónico</label>
                                <input type="email" name="email" value="{{ request.user.email }}" class="form-control rounded-3 py-2 u-inline-b4973e868e" required>
                            </div>
                            <div class="col-md-5">
                                <label class="form-label small fw-bold u-inline-9bca4b1fbc">País</label>
                                <select name="pais_codigo" class="form-select rounded-3 py-2 u-inline-b4973e868e" id="paisCodigo">
                                    <option value="+57" selected>COL (+57)</option>
                                    <option value="+1">USA (+1)</option>
                                    <option value="+52">MEX (+52)</option>
                                    <option value="+54">ARG (+54)</option>
                                    <option value="+34">ESP (+34)</option>
                                    <option value="+56">CHL (+56)</option>
                                </select>
                            </div>
                            <div class="col-md-7">
                                <label class="form-label small fw-bold u-inline-9bca4b1fbc">Teléfono</label>
                                <input type="text" name="telefono" value="{{ usuario.telefono }}" class="form-control rounded-3 py-2 u-inline-b4973e868e"
                                pattern="[0-9\s]*" title="Solo se admiten números y espacios" oninput="this.value = this.value.replace(/[^0-9\s]/g, '')">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold u-inline-9bca4b1fbc">Tipo Documento</label>
                                <select name="tipo_documento" class="form-select rounded-3 py-2 u-inline-b4973e868e">
                                    {% for code, name in usuario.TIPOS_DOCUMENTO %}
                                        <option value="{{ code }}" {% if usuario.tipo_documento == code %}selected{% endif %}>{{ name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-12">
                                <label class="form-label small fw-bold u-inline-9bca4b1fbc">Número de Identificación</label>
                                <input type="text" name="documento" value="{{ usuario.documento }}" class="form-control rounded-3 py-2 u-inline-b4973e868e" required
                                pattern="[0-9\s]*" title="Solo se admiten números y espacios" oninput="this.value = this.value.replace(/[^0-9\s]/g, '')">
                            </div>
                        </div>

                        <div class="d-grid gap-2 mt-5">
                            <button type="submit" class="btn btn-accent fw-bold py-3 rounded-pill shadow-sm" aria-label="Enviar formulario" data-tooltip="Enviar formulario" title="Enviar formulario">
                                Guardar Cambios
                            </button>
                            <a href="javascript:history.back()" class="btn btn-outline-light py-3 rounded-pill u-inline-8980a04e41">
                                Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .btn-accent {
        background-color: var(--color-accent);
        color: #000;
        border: none;
    }
    .btn-accent:hover {
        background-color: #d68910;
        color: #000;
    }
    .btn-outline-accent {
        color: var(--color-accent);
        border-color: var(--color-accent);
    }
    .btn-outline-accent:hover {
        background-color: var(--color-accent);
        color: #000;
    }
    .form-control:focus, .form-select:focus {
        background-color: var(--item-bg) !important;
        box-shadow: 0 0 0 0.25rem rgba(243, 156, 18, 0.25);
        border-color: var(--color-accent);
        color: var(--color-text);
    }

    .edit-profile-avatar-container {
        position: relative;
        display: inline-block;
        z-index: 1;
    }

    .edit-profile-avatar-img {
        width: 150px;
        height: 150px;
        object-fit: cover;
        border-radius: 50%;
        border: 4px solid var(--color-accent);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        display: block;
    }

    .edit-profile-avatar-placeholder {
        width: 150px;
        height: 150px;
        border-radius: 50%;
        background-color: var(--color-accent);
        border: 4px solid var(--color-accent);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #000;
    }
</style>

<script>
    // Aceptar cualquier archivo sin restricciones de tipo
    document.getElementById('foto_perfil').addEventListener('change', function (evt) {
        const [file] = this.files;
        if (file) {
            // Solo validar tamaño
            if (file.size > 100 * 1024 * 1024) {
                alert('El archivo es demasiado grande. El tamaño máximo es 100MB.');
                this.value = '';
                return;
            }
            
            // Mostrar previsualización si es imagen
            if (file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById('avatar-preview');
                    preview.innerHTML = `<img src="${e.target.result}" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;">`;
                };
                reader.readAsDataURL(file);
            }
        }
    });
</script>
{% endblock %}
